# Port Scan
name: port_scan
description: "Escaneo de puertos TCP contra un host objetivo"
label: ATTACK

target:
  host: h4
  ip: 10.1.1.4

attackers:
  - host: h1

tool: nmap
params:
  # 20 puertos únicos deben llegar en PORT_SCAN_WINDOW=5 s.
  flags: "-Pn -n -sS --min-rate 100 -p 1-100"
  duration_seconds: 10

# Uso manual en Mininet CLI:
# h1 nmap -Pn -n -sS --min-rate 100 -p 1-100 10.1.1.4
