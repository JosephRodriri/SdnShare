# Escenario: HTTP Flood con Apache Benchmark
# Objetivo: Verificar que HTTP flood se detecta sin bloquear por SYN.
#
# Casos de prueba:
#   ab con keep-alive: pocos SYN + muchos HTTP → BLOCKED(HTTP_FLOOD)


scenario:
  name: "HTTP Flood — Apache Benchmark"
  id: http_flood_ab
  version: "1.0"
  category: http_flood
  severity: high
  description: |
    HTTP flood usando Apache Benchmark (ab) con conexiones persistentes.
    Se abren 10 conexiones y se envían 200 GET: supera
    HTTP_FLOOD_THRESHOLD=10 req/s sin alcanzar SYN_FLOOD_THRESHOLD=100 SYN/s.

attack:
  tool: ab
  command_template: "ab -k -c 10 -n 200 -s 5 http://{target}/"

topology:
  attacker: h2
  target: h4
  target_port: 80
  target_service: "python3 -m http.server 80"

expected_detection:
  attack_type: HTTP_FLOOD
  must_not_detect_as: SYN_FLOOD   # Validación de no falso positivo
  max_detection_time_s: 3.0

validation:
  pre_attack:
    - action: start_http_server
      host: h4
      port: 80
  post_attack:
    - action: ping_test
      from: h2
      to: h4
      expected_loss_pct: 100
    - action: check_log
      pattern: "HTTP_FLOOD"
      must_not_contain: "SYN_FLOOD"

evidence:
  collect_pcap: true
  collect_controller_log: true
  collect_http_server_log: true
