# Escenario: HTTP Flood con curl
# Objetivo: Verificar que HTTP flood se detecta sin bloquear por SYN.
#
# Casos de prueba:
#   curl concurrente: SYN iniciales + HTTP → HTTP_CANDIDATE → BLOCKED


scenario:
  name: "HTTP Flood — curl concurrente"
  id: http_flood_curl
  version: "1.0"
  category: http_flood
  severity: high
  description: |
    HTTP flood usando curl, disponible en la imagen de Mininet.
    Se envían 30 GET concurrentes: superan HTTP_FLOOD_THRESHOLD=10 req/s,
    sin alcanzar SYN_FLOOD_THRESHOLD=100 SYN/s.

attack:
  tool: curl
  command_template: "for i in $(seq 1 30); do curl -sS --http1.0 --max-time 2 http://{target}/ > /dev/null & done; wait"

topology:
  attacker: h2
  target: h4
  target_port: 80
  target_service: "python3 -m http.server 80"

expected_detection:
  attack_type: HTTP_FLOOD
  must_not_detect_as: SYN_FLOOD   # Validación de no falso positivo
  max_detection_time_s: 3.0

validation:
  pre_attack:
    - action: start_http_server
      host: h4
      port: 80
  post_attack:
    - action: ping_test
      from: h2
      to: h4
      expected_loss_pct: 100
    - action: check_log
      pattern: "HTTP_FLOOD"
      must_not_contain: "SYN_FLOOD"

evidence:
  collect_pcap: true
  collect_controller_log: true
  collect_http_server_log: true
