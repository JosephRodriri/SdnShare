server:
  port: 8090

spring:
  application:
    name: sdn-monitor

  datasource:
    url: jdbc:postgresql://localhost:5432/sdn_monitor
    username: sdn_user
    password: sdn_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Configuración SDN externas
sdn:
  influxdb:
    host: http://localhost:8086
    database: ryu_monitor
    poll-interval-ms: 10000       # cada 10 segundos

  prometheus:
    host: http://localhost:9090
    poll-interval-ms: 15000       # cada 15 segundos

  ryu:
    host: http://localhost:8080   # FlowManager / Ryu REST API

  anomaly:
    ddos-critical-threshold: 1000  # pps
    ddos-high-threshold: 500       # pps
    check-interval-ms: 5000        # cada 5 segundos

# CORS para React
cors:
  allowed-origins: "http://localhost:3001"

logging:
  level:
    com.sdn.monitor: DEBUG
    org.springframework.web.socket: INFO