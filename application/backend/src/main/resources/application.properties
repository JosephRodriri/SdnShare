server.port=8090
spring.application.name=SdnShare

spring.datasource.url=${URL_DB}
spring.datasource.username=${USER_NAME}
spring.datasource.password=${PASSWORD_DB}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false


sdn.influxdb.host=http://localhost:8086
sdn.influxdb.database=ryu_monitor
sdn.influxdb.username=root
sdn.influxdb.password=root
sdn.influxdb.poll-interval-ms=10000


sdn.prometheus.host=http://localhost:9090
sdn.prometheus.poll-interval-ms=15000


sdn.ryu.host=http://localhost:8080


sdn.anomaly.ddos-critical-threshold=1000
sdn.anomaly.ddos-high-threshold=500
sdn.anomaly.check-interval-ms=5000


sdn.topology.config-file=infra/configs/network_config.yaml

cors.allowed-origins=http://localhost:3001,http://localhost:5173


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


logging.level.com.example.SdnShare=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.hibernate.SQL=WARN



jwt.secret.key=${TOKEN_JWT}
jwt.expiration.time=86400000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method


