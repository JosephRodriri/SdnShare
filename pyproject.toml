[project]
name = "sednet-ddos-detection"
version = "0.1.0"
description = "SDN-based DDoS detection system with ML pipeline"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # SDN Controller
    "ryu>=4.34",
    "eventlet>=0.30.0",
    "mininet>=2.3.0",
    # Data handling
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    # Web and WSGI
    "webob>=1.8.6",
    "werkzeug>=2.0.0",
    # Utilities
    "requests>=2.26.0",
    "urllib3>=1.26.0",
    "certifi>=2021.10.0",
    "uritemplate>=4.1.0",
    # Open vSwitch
    "ovs>=2.5.0",
    "netaddr>=0.8.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.1.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.12.0",
]
monitor = [
    "graphyte>=1.6.0",
    "influxdb>=5.3.0",
    "influxdb-client>=1.40.0",
    "prometheus-client>=0.14.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ipython>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "ruff>=0.1.0",
]
all = [
    "sednet-ddos-detection[ml,monitor,notebooks,dev]",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
